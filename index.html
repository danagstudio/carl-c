    ${GROUPS.map(g => `<details><summary>${g.label}${ic('chevD')}</summary>${g.items.map(k => `<a href="${svcLink(k)}">${SERVICES[k].name}</a>`).join('')}</details>`).join('')}
    <a class="solo" href="#/about">About us</a><a class="solo" href="#/track">Track my application</a><a class="solo" href="#/contact">Contact</a>
    <a class="btn" href="#/contact?to=book">Book a consultation</a>
    <a class="btn btn-wa" style="margin-top:12px" href="${wa('Hello Carl-C')}" target="_blank" rel="noopener">${ic('wa')}WhatsApp us</a>
    <p class="d-contact">Call <a href="${telHref(CO.phones[0])}">${CO.phones[0]}</a> or <a href="${telHref(CO.phones[1])}">${CO.phones[1]}</a></p></nav>`;
  $('#ftr').innerHTML = `<div class="wrap"><div class="ftr-grid">
    <div><div class="co">CARL-C Limited Company</div><div class="tagl">${CO.tagline}</div><p class="regs">Company reg. ${CO.reg.company}<br>TIN ${CO.reg.tin}<br>Business name ${CO.reg.bn}<br>PEA licence ${CO.pea ? CO.pea.no : tbc()}</p></div>
    <div><h3>Services</h3><ul>${Object.entries(SERVICES).map(([k, s]) => `<li><a href="${svcLink(k)}">${s.name}</a></li>`).join('')}</ul></div>
    <div><h3>Help</h3><ul><li><a href="#/track">Track my application</a></li><li><a href="#/faq">FAQ</a></li><li><a href="#/fees">Fees and refunds</a></li><li><a href="#/anti-fraud">Anti-fraud notice</a></li><li><a href="#/news">News and guides</a></li><li><a href="#/testimonials">Client stories</a></li><li><a href="#/privacy">Privacy policy</a></li><li><a href="#/terms">Terms</a></li><li><a href="#/staff">Verify a staff member</a></li><li><a href="#/staff-portal">Staff portal</a></li></ul></div>
    <div><h3>Contact</h3><ul>${CO.phones.map(p => `<li><a href="${telHref(p)}">${p}</a></li>`).join('')}<li><a href="${wa('Hello Carl-C')}" target="_blank" rel="noopener">WhatsApp ${CO.waDisplay}</a></li><li><a href="mailto:${CO.email}">${CO.email}</a></li><li>${CO.address ? esc(CO.address) : 'Office address ' + tbc()}<br>${esc(CO.pobox || '')}<br>GPS ${esc(CO.gps || '')}</li><li>Mon to Fri 8:30am to 5:00pm<br>Sat 9:00am to 1:00pm</li><li>Branches: <a href="#/contact?to=offices">Agona Swedru and Techiman</a></li></ul></div>
    </div><div class="ftr-bottom"><span>© 2026 CARL-C Limited Company. All rights reserved.</span><span>Website by DANAG STUDIO</span></div></div>`;
  const S = store.get();
  if (S.ribbonClosed) $('#ribbon').remove();
}
const drawer = open => {
  const d = $('#drawer'); d.classList.toggle('open', open); d.setAttribute('aria-hidden', !open);
  $('.menu-btn').setAttribute('aria-expanded', open); document.body.style.overflow = open ? 'hidden' : '';
  if (open) $('[data-close]', d).focus();
};
const closeDD = () => $$('.dd.open').forEach(d => { d.classList.remove('open'); $('button', d).setAttribute('aria-expanded', 'false'); });

/* ---------- modal: pay online ---------- */
function payModal() {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="pay-h"><div class="modal-head"><h2 id="pay-h">Pay online</h2><button type="button" class="x" data-mclose aria-label="Close">${ic('x')}</button></div>
    <form data-pay novalidate><div class="fgrid">
      <div class="field full" data-f="pref"><label for="p-ref">Your reference number</label><input id="p-ref" name="ref" type="text" placeholder="CC-100245"><div class="errmsg"></div></div>
      <div class="field full" data-f="pamt"><label for="p-amt">Amount in GH₵</label><input id="p-amt" name="amt" type="number" min="1" inputmode="decimal"><div class="hint">Use the amount on your quote or invoice.</div><div class="errmsg"></div></div>
      <fieldset class="field full"><legend>Pay with</legend><div class="radios"><label><input type="radio" name="m" value="MoMo" checked>Mobile Money</label><label><input type="radio" name="m" value="Card">Card</label></div></fieldset>
    </div><div class="form-foot"><button class="btn btn-plum" type="submit">${ic('lock')}Continue to secure payment</button></div></form></div>`;
  m.classList.add('open'); $('#p-ref', m).focus();
}

function watchExternal(href) {
  let left = false;
  const mark = () => { left = true; };
  window.addEventListener('blur', mark, { once: true });
  document.addEventListener('visibilitychange', mark, { once: true });
  setTimeout(() => {
    window.removeEventListener('blur', mark); document.removeEventListener('visibilitychange', mark);
    if (!left && document.visibilityState === 'visible' && document.hasFocus()) blockedModal(href);
  }, 1500);
}
function blockedModal(href) {
  const m = $('#modal'), isWA = href.includes('wa.me');
  m.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="bl-h"><div class="modal-head"><h2 id="bl-h">${isWA ? 'Open WhatsApp' : 'Open link'}</h2><button type="button" class="x" data-mclose aria-label="Close">${ic('x')}</button></div>
    <p>This window could not open ${isWA ? 'WhatsApp' : 'the link'}. ${isWA ? `Message us on <b>${CO.waDisplay}</b>, or copy` : 'Copy'} the link below into your browser.</p>
    <div class="field"><label for="bl-l">Link</label><input id="bl-l" type="text" readonly value="${esc(href)}"></div>
    <div class="btn-row" style="margin-top:16px"><button type="button" class="btn btn-plum" data-copy>Copy link</button><button type="button" class="btn btn-line" data-mclose>Close</button></div></div>`;
  m.classList.add('open'); $('#bl-l', m).select();
}

/* ---------- router ---------- */
function toPlain(h) {
  const [path, qs] = String(h || '').replace(/^#\/?/, '').split('?');
  const [k, sub] = path.split('/');
  if (k === 'news' && sub) return 'news-' + sub;
  if (k === 'staff' && qs) { const id = new URLSearchParams(qs).get('id'); if (id) return 'staff-' + id; }
  return k || 'home';
}
function fromPlain(hash) {
  const n = String(hash || '').replace(/^#/, '');
  if (!n || n === 'home') return '#/';
  if (n.startsWith('/')) return '#' + n;            // older #/path links still work
  if (n.startsWith('news-') && POSTS.some(p => 'news-' + p.slug === n)) return '#/news/' + n.slice(5);
  if (PAGES[n]) return '#/' + n;
  if (n.startsWith('staff-')) return '#/staff?id=' + encodeURIComponent(n.slice(6));   // staff ID card QR links
  return '#/';
}
let current = fromPlain(location.hash);
function go(h) {
  current = h;
  const plain = toPlain(h);
  try { if (location.hash.replace(/^#/, '') !== plain) location.hash = plain; } catch (e) { }
  render();
}
function parse() {
  const h = current.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const parts = (path || '').split('/').filter(Boolean);
  const q = Object.fromEntries(new URLSearchParams(qs || ''));
  return { key: parts[0] || '', sub: parts[1], q };
}
function render() {
  const { key, sub, q } = parse();
  const pg = PAGES[key] || PAGES['404'];
  fid = 0;
  $('#main').innerHTML = pg.html(q, sub);
  const title = key === '' ? `CARL-C Limited Company | ${pg.title}` : `${sub && key === 'news' ? (POSTS.find(p => p.slug === sub) || {}).title || pg.title : pg.title} | CARL-C Limited Company`;
  document.title = title;
  $('meta[name=description]').setAttribute('content', pg.desc || PAGES[''].desc);
  $('#wa-fab').href = wa(pg.wa || 'Hello Carl-C');
  $$('[data-board]').forEach(drawBoard);
  $$('[data-quiz]').forEach(el => drawQuiz(el));
  pg.init && pg.init(q, sub);
  // active nav
  const grp = SERVICES[key] ? SERVICES[key].group : null;
  $$('.nav .dd').forEach(d => d.classList.toggle('on', d.dataset.g === grp));
  $$('.nav [data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === key));
  drawer(false); closeDD();
  if (q.to) setTimeout(() => { const t = document.getElementById(q.to); t && t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
  else window.scrollTo(0, 0);
  $('#main').focus({ preventScroll: true });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const sub = t.closest('form button[type=submit]');
  if (sub) { e.preventDefault(); handleForm(sub.closest('form')); return; }
  const link = t.closest('a[href^="#/"]');
  if (link) { e.preventDefault(); go(link.getAttribute('href')); return; }
  const ext = t.closest('a[target="_blank"]');
  if (ext) { watchExternal(ext.href); return; }
  const ddBtn = t.closest('.dd > button');
  if (ddBtn) { const d = ddBtn.parentElement, open = !d.classList.contains('open'); closeDD(); d.classList.toggle('open', open); ddBtn.setAttribute('aria-expanded', open); return; }
  if (!t.closest('.dd')) closeDD();
  if (t.closest('.menu-btn')) return drawer(true);
  if (t.closest('[data-close]')) return drawer(false);
  if (t.closest('#ribbon button')) { $('#ribbon').remove(); store.get().ribbonClosed = true; store.save(); return; }
  const to = t.closest('[data-to]');
  if (to) { const el = document.getElementById(to.dataset.to); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); if (el.id === 'main') el.focus({ preventScroll: true }); } return; }
  const chip = t.closest('[data-filter] .chip');
  if (chip) { const grp = chip.parentElement, b = chip.closest('[data-board]'); $$('.chip', grp).forEach(c => c.setAttribute('aria-pressed', c === chip)); b.dataset[grp.dataset.filter] = chip.dataset.v; drawBoard(b); return; }
  const ap = t.closest('[data-apply]');
  if (ap) { const j = allJobs().find(x => x.id === ap.dataset.apply), sel = $('#apply select[name=job]'); if (j && sel) sel.value = `${jobLabel(j)}`; $('#apply').scrollIntoView({ behavior: 'smooth', block: 'start' }); setTimeout(() => $('#apply input[name=name]').focus({ preventScroll: true }), 500); return; }
  const slot = t.closest('.slot');
  if (slot && !slot.disabled) { const fs = slot.closest('fieldset'); $$('.slot', fs).forEach(s => s.setAttribute('aria-pressed', s === slot)); $('input[name=btime]', fs).value = slot.dataset.slot; return; }
  const pk = t.closest('[data-pick]');
  if (pk) { const tr = INTL_TOURS.find(x => x.id === pk.dataset.pick), sel = $('#apply select[name=trip]'); if (sel && tr) { sel.value = tr.name; $('#apply').scrollIntoView({ behavior: 'smooth', block: 'start' }); } else if (tr) go(`#/international-tours?trip=${tr.id}&to=apply`); return; }
  const vb = t.closest('[data-visa]'); if (vb) return drawVisa(vb.dataset.visa);
  const qa = t.closest('[data-qa]');
  if (qa) { const el = qa.closest('[data-quiz]'), ans = JSON.parse(el.dataset.ans || '[]'); ans.push(+qa.dataset.qa); return drawQuiz(el, +el.dataset.step + 1, ans); }
  const qb = t.closest('[data-qback]');
  if (qb) { const el = qb.closest('[data-quiz]'), ans = JSON.parse(el.dataset.ans || '[]'); ans.pop(); return drawQuiz(el, +el.dataset.step - 1, ans); }
  if (t.closest('[data-qreset]')) return drawQuiz(t.closest('[data-quiz]'));
  const st = t.closest('[data-stab]'); if (st) return drawStaff(st.dataset.stab);
  if (t.closest('[data-modal="pay"]')) return payModal();
  if (t.closest('[data-copy]')) { const i = $('#bl-l'); i.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (err) { } try { if (navigator.clipboard) navigator.clipboard.writeText(i.value).catch(() => { }); } catch (err) { } t.closest('[data-copy]').textContent = ok ? 'Copied' : 'Select and copy the link'; return; }
  if (t.closest('[data-mclose]') || t.id === 'modal') { $('#modal').classList.remove('open'); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'file') { const d = t.closest('.drop'), f = t.files[0]; if (d) { d.classList.toggle('has', !!f); $('.dtxt', d).innerHTML = f ? `<b>${esc(f.name)}</b><br><span>${(f.size / 1024 / 1024).toFixed(1)} MB. Tap to change.</span>` : '<b>Choose a file</b>'; } }
  if (t.name === 'bdate') { const fs = t.closest('fieldset'); $$('.slot', fs).forEach(s => { s.disabled = slotDisabled(t.value, s.dataset.slot); if (s.disabled && s.getAttribute('aria-pressed') === 'true') { s.setAttribute('aria-pressed', 'false'); $('input[name=btime]', fs).value = ''; } }); }
  if (t.matches('[data-stage]')) { const ref = t.dataset.stage, S = store.get(); let e = S.enq.find(x => x.ref === ref); if (!e) { e = JSON.parse(JSON.stringify(SEED_ENQUIRIES.find(x => x.ref === ref))); S.enq.push(e); } e.stage = +t.value; store.save(); }
});
document.addEventListener('submit', e => { e.preventDefault(); handleForm(e.target); });
function handleForm(f) {
  if (!f) return;
  const e = { preventDefault() { } };
  if (f.matches('form[data-form]')) { e.preventDefault(); submitForm(f); }
  if (f.matches('[data-track]')) { e.preventDefault(); runTrack(); }
  if (f.matches('[data-addjob]')) {
    e.preventDefault(); const fd = new FormData(f);
    const need = ['title', 'country', 'city', 'sector', 'deadline', 'reqs'].filter(k => !String(fd.get(k) || '').trim());
    if (need.length) { $('[data-addjob-msg]').textContent = 'Fill in every field to publish.'; return; }
    store.get().jobs.unshift({ id: 's' + Date.now(), type: fd.get('type'), title: fd.get('title'), country: fd.get('country'), city: fd.get('city'), sector: fd.get('sector'), contract: fd.get('contract') || 'Contract shared at interview', pay: '', reqs: String(fd.get('reqs')).split('\n').map(s => s.trim()).filter(Boolean), deadline: fd.get('deadline'), sample: false });
    store.save(); drawStaff('jobs'); $('[data-addjob-msg]').textContent = 'Published. It now shows on the job board.';
  }
  if (f.matches('[data-pay]')) {
    e.preventDefault(); const ref = f.ref.value.trim(), amt = f.amt.value;
    setErr(f, 'pref', ref ? '' : 'Enter the reference number on your quote.'); setErr(f, 'pamt', amt > 0 ? '' : 'Enter the amount to pay.');
    if (!ref || !(amt > 0)) return;
    $('.modal-card').innerHTML = `<div class="modal-head"><h2>Secure checkout</h2><button type="button" class="x" data-mclose aria-label="Close">${ic('x')}</button></div>
      <p>At launch, this step opens the Paystack or Hubtel checkout for <b>${money(amt)}</b> against <b>${esc(ref.toUpperCase())}</b>. You approve the payment on your phone or card, and we send your official receipt by SMS and email.</p>
      ${notice('<p>This preview does not take payments.</p>', 'notice-gold', 'info')}<button type="button" class="btn btn-plum" data-mclose>Close</button>`;
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDD(); drawer(false); $('#modal').classList.remove('open'); } });
window.addEventListener('hashchange', () => { if (location.hash.replace(/^#/, '') !== toPlain(current)) { current = fromPlain(location.hash); render(); } });

chrome();
render();
})();
</script>
